name: Cron

on:
  pull_request:
  push:
  schedule:
    - cron: '0/5 * * * *'
  workflow_dispatch:

jobs:
  cron:
    name: Cron
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mvorisek/image-php
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure PHP
        run: |
          rm /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
          php --version

      - name: Install PHP dependencies
        run: |
          composer remove --no-interaction --no-update friendsofphp/php-cs-fixer ergebnis/composer-normalize --dev
          composer remove --no-interaction --no-update phpstan/\* --dev
          composer update --ansi --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: "Run tests (only for Phpunit)"
        run: |
          echo '<?php return ["mvorisek#actions" => "${{ secrets.TOKEN_GITHUB_MVORISEK_MVORISEK_ACTIONS }}", "mvorisek/crobot#contents" => "${{ secrets.TOKEN_GITHUB_MVORISEK_MVORISEK_CROBOT_CONTENTS }}", "atk4#actions" => "${{ secrets.TOKEN_GITHUB_MVORISEK_ATK4_ACTIONS }}"];' > github-token.php.local
          vendor/bin/phpunit --exclude-group none --no-coverage --fail-on-warning --fail-on-risky $(if vendor/bin/phpunit --version | grep -q '^PHPUnit 9\.'; then echo -v; else echo --fail-on-notice --fail-on-deprecation --display-notices --display-deprecations --display-warnings --display-errors --display-incomplete --display-skipped; fi) tests/CronTest.php
