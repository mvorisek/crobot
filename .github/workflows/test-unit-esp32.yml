name: Unit ESP32

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0/2 * * *'
  workflow_dispatch:

jobs:
  unit-test:
    name: EPS32 Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

  cs:
    name: EPS32 CS
    if: false # we need solution with autofix for start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run clang-format
        uses: jidicula/clang-format-action@v4.18.0
        with:
          check-path: 'esp32'
