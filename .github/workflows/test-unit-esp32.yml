name: Unit ESP32

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0/2 * * *'
  workflow_dispatch:

jobs:
  unit-test:
    name: EPS32 Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        run: |
          # manual: https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-guides/tools/idf-docker-image.html
          # docker image source: https://github.com/espressif/esp-idf/blob/v6.1/tools/docker/Dockerfile
          docker run --rm \
              -v "$(git rev-parse --show-toplevel)/esp32/fw-hello-world":/h \
              -w /h \
              -e IDF_TARGET=esp32 \
              docker.io/espressif/idf:v6.1 \
              idf.py build

  cs:
    name: EPS32 CS
    if: false # we need solution with autofix for start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run clang-format
        uses: jidicula/clang-format-action@v4.18.0
        with:
          check-path: 'esp32'
