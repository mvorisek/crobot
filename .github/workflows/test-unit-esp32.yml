name: Unit ESP32

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0/2 * * *'
  workflow_dispatch:

jobs:
  unit-test:
    name: EPS32 Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@main
        with:
          esp_idf_version: v3.3.1
          path: esp32

      - name: Run image
        run: |
          cd esp32
          docker run --rm app apt -v

  cs:
    name: EPS32 CS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run clang-format
        uses: jidicula/clang-format-action@v4.18.0
        with:
          check-path: 'esp32'
