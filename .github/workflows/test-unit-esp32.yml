name: Unit ESP32

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0/2 * * *'
  workflow_dispatch:

jobs:
  unit-test:
    name: EPS32 Unit
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@main
        with:
          # based on https://github.com/espressif/esp-idf/blob/v6.0.3/tools/docker/Dockerfile
          esp_idf_docker_image: espressif/idf
          esp_idf_version: v6.0.3
          path: esp32
          target: esp32
          command: idf.py build


      - uses: stefanzweifel/git-auto-commit-action@v7

  cs:
    name: EPS32 CS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run clang-format
        uses: jidicula/clang-format-action@v4.18.0
        with:
          check-path: 'esp32'
